      const styles = {
        '祈祷室': { badge: 'bg-sky-50 text-sky-700 border-sky-200', icon: '🕌' },
        'トイレの水洗浄': { badge: 'bg-cyan-50 text-cyan-700 border-cyan-200', icon: '🚰' },
        'ハラール給食': { badge: 'bg-amber-50 text-amber-800 border-amber-200', icon: '🍱' },
        '土葬': { badge: 'bg-purple-50 text-purple-700 border-purple-200', icon: '🪦' },
        '介護・病院のヒジャブ': { badge: 'bg-emerald-50 text-emerald-700 border-emerald-200', icon: '🏥' },
        'ヒジャブ・ひげ容認の求人': { badge: 'bg-rose-50 text-rose-700 border-rose-200', icon: '📋' }
      };
      return styles[category] || { badge: 'bg-slate-100 text-slate-700 border-slate-200', icon: '📌' };
    }

    // 媒体ごとのバッジスタイル
    function getMediaBadge(media) {
      const styles = {
        'Instagram': 'bg-pink-50 text-pink-700 border-pink-200',
        'Threads': 'bg-slate-100 text-slate-800 border-slate-300',
        'Facebook': 'bg-blue-50 text-blue-700 border-blue-200',
        'X': 'bg-zinc-900 text-white border-zinc-800',
        'YouTube': 'bg-red-50 text-red-700 border-red-200',
        '報道': 'bg-indigo-50 text-indigo-700 border-indigo-200'
      };
      return styles[media] || 'bg-slate-50 text-slate-600 border-slate-200';
    }

    // 反響（いいね数・表示回数）を数値に変換して比較可能にする
    function parseReactionScore(str) {
      if (!str) return 0;
      const s = str.toString().replace(/,/g, '').trim();
      const numMatch = s.match(/([0-9.]+)/);
      if (!numMatch) return 0;
      let val = parseFloat(numMatch[1]);
      if (s.includes('万')) val *= 10000;
      else if (s.toUpperCase().includes('K')) val *= 1000;
      else if (s.toUpperCase().includes('M')) val *= 1000000;
      return val;
    }

    // スプレッドシートからデータを取得（JSONP方式でCORS回避）
    function fetchSheetData() {
      const statusEl = document.getElementById('status-indicator');
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> 同期中...`;

      window.google = window.google || {};
      window.google.visualization = window.google.visualization || {};
      window.google.visualization.Query = {
        setResponse: function(response) {
          try {
            if (response && response.table && response.table.rows) {
              const parsed = response.table.rows.map(row => {
                const c = row.c || [];
                const getVal = (idx) => (c[idx] ? (c[idx].f || c[idx].v || '') : '').toString().trim();
                return {
                  date: getVal(0),
                  category: getVal(1),
                  region: getVal(2),
                  media: getVal(3),
                  author: getVal(4),
                  summary: getVal(5),
                  reaction: getVal(6),
                  url: getVal(7)
                };
              }).filter(item => (item.summary || item.category) && item.category !== 'カテゴリ' && item.date !== '日付');

              if (parsed.length > 0) {
                allRecords = parsed;
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> スプレッドシート同期済`;
                initUI();
                return;
              }
            }
          } catch (e) {
            console.warn('Parse error:', e);
          }
          useFallbackData();
        }
      };

      const oldScript = document.getElementById('gviz-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gviz-script';
      script.src = SHEET_GVIZ_URL + '&_t=' + Date.now();
      script.onerror = function() {
        useFallbackData();
      };
      document.body.appendChild(script);
    }

    function useFallbackData() {
      allRecords = [...FALLBACK_DATA];
      const statusEl = document.getElementById('status-indicator');
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400"></span> アーカイブ表示中`;
      initUI();
    }

    function populateSelect(selectId, items, defaultLabel) {
      const selectEl = document.getElementById(selectId);
      const currentVal = selectEl.value;
      selectEl.innerHTML = `<option value="ALL">${defaultLabel}</option>`;
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        selectEl.appendChild(opt);
      });
      if (items.includes(currentVal)) selectEl.value = currentVal;
    }

    function initUI() {
      const categories = [...new Set(allRecords.map(r => r.category).filter(Boolean))];
      const regions = [...new Set(allRecords.map(r => r.region).filter(Boolean))];
      const medias = [...new Set(allRecords.map(r => r.media).filter(Boolean))];

      populateSelect('category-select', categories, 'すべての項目');
      populateSelect('region-select', regions, 'すべての地域');
      populateSelect('media-select', medias, 'すべての媒体');

      renderSummaryStats(categories);
      renderCategoryPills(categories);
      renderRecords();
    }

    // 上部のカテゴリ別件数カード描画
    function renderSummaryStats(categories) {
      const container = document.getElementById('summary-stats');
      const selectedCat = document.getElementById('category-select').value;

      container.innerHTML = categories.map(cat => {
        const count = allRecords.filter(r => r.category === cat).length;
        const style = getCategoryStyle(cat);
        const isActive = selectedCat === cat;
        return `
          <button onclick="selectCategoryQuick('${escapeHtml(cat)}')" 
            class="text-left p-3 rounded-xl border transition flex flex-col justify-between ${
              isActive 
                ? 'bg-indigo-50/90 border-indigo-500 ring-2 ring-indigo-500/20 shadow-sm' 
                : 'bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50/60 shadow-sm'
            }">
            <div class="flex items-center justify-between gap-1 mb-1">
              <span class="text-base">${style.icon}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded-full ${ isActive ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700' }">${count}件</span>
            </div>
            <div class="text-xs font-bold text-slate-800 line-clamp-1">${escapeHtml(cat)}</div>
          </button>
        `;
      }).join('');
    }

    function selectCategoryQuick(cat) {
      const selectEl = document.getElementById('category-select');
      selectEl.value = (selectEl.value === cat) ? 'ALL' : cat;
      trackGAEvent('filter_category', { category: selectEl.value });
      initUI();
    }

    function renderCategoryPills(categories) {
      const pillsContainer = document.getElementById('category-pills');
      pillsContainer.innerHTML = '';
      pillsContainer.appendChild(createPillButton('すべて', 'ALL'));
      categories.forEach(cat => {
        pillsContainer.appendChild(createPillButton(cat, cat));
      });
    }

    function createPillButton(label, value) {
      const btn = document.createElement('button');
      const isSelected = document.getElementById('category-select').value === value;
      btn.className = `text-xs px-3 py-1 rounded-full border transition font-bold ${
        isSelected 
          ? 'bg-slate-800 text-white border-slate-800 shadow-sm' 
          : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
      }`;
      btn.textContent = label;
      btn.onclick = () => {
        document.getElementById('category-select').value = value;
        trackGAEvent('filter_category', { category: value });
        initUI();
      };
      return btn;
    }

    function normalizeDate(str) {
      if (!str) return '';
      return str.replace(/-/g, '/').trim();
    }

    function renderRecords() {
      const keyword = document.getElementById('search-input').value.trim().toLowerCase();
      const selectedCat = document.getElementById('category-select').value;
      const selectedRegion = document.getElementById('region-select').value;
      const selectedMedia = document.getElementById('media-select').value;
      const selectedDate = normalizeDate(document.getElementById('date-input').value);
      const sortOrder = document.getElementById('sort-select').value;

      document.getElementById('clear-search').classList.toggle('hidden', !keyword);

      let filtered = allRecords.filter(item => {
        const matchKeyword = !keyword || 
          item.summary.toLowerCase().includes(keyword) ||
          item.category.toLowerCase().includes(keyword) ||
          item.region.toLowerCase().includes(keyword) ||
          item.media.toLowerCase().includes(keyword) ||
          item.author.toLowerCase().includes(keyword) ||
          item.date.toLowerCase().includes(keyword);

        const matchCat = selectedCat === 'ALL' || item.category === selectedCat;
        const matchRegion = selectedRegion === 'ALL' || item.region === selectedRegion;
        const matchMedia = selectedMedia === 'ALL' || item.media === selectedMedia;
        const matchDate = !selectedDate || normalizeDate(item.date) === selectedDate;

        return matchKeyword && matchCat && matchRegion && matchMedia && matchDate;
      });

      // ソート処理
      filtered.sort((a, b) => {
        if (sortOrder === 'reaction_desc') {
          return parseReactionScore(b.reaction) - parseReactionScore(a.reaction);
        }
        const dateA = normalizeDate(a.date) || '0000/00/00';
        const dateB = normalizeDate(b.date) || '0000/00/00';
        return sortOrder === 'date_desc' ? dateB.localeCompare(dateA) : dateA.localeCompare(dateB);
      });

      document.getElementById('result-count').textContent = filtered.length;
      document.getElementById('total-count').textContent = `（全 ${allRecords.length} 件中）`;

      const cardContainer = document.getElementById('archive-container-card');
      const tableBody = document.getElementById('archive-table-body');
      const emptyState = document.getElementById('empty-state');

      cardContainer.innerHTML = '';
      tableBody.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach(item => {
        const catStyle = getCategoryStyle(item.category);
        const mediaClass = getMediaBadge(item.media);
        const dateDisplay = item.date ? `📅 ${escapeHtml(item.date)}` : '📅 日付記録なし';

        // カード生成
        const card = document.createElement('article');
        card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col justify-between card-hover';
        card.innerHTML = `
          <div>
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded">${dateDisplay}</span>
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${catStyle.badge}">${catStyle.icon} ${ highlightText(item.category, keyword) }</span>
                ${item.region ? `<span class="text-xs font-bold text-slate-700 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded">📍 ${ highlightText(item.region, keyword) }</span>` : ''}
              </div>
              ${item.reaction ? `<span class="text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 px-2.5 py-0.5 rounded-full">🔥 反響: ${escapeHtml(item.reaction)}</span>` : ''}
            </div>

            <p class="text-sm sm:text-base font-bold text-slate-900 mb-3 leading-relaxed">${highlightText(item.summary, keyword)}</p>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-100 mt-2">
            <div class="flex items-center gap-2 text-xs text-slate-600">
              <span class="font-bold px-2 py-0.5 rounded border ${mediaClass}">${highlightText(item.media || '不明', keyword)}</span>
              <span class="font-medium text-slate-700 truncate max-w-[200px]" title="${escapeHtml(item.author)}">👤 ${highlightText(item.author || '記録なし', keyword)}</span>
            </div>
            ${item.url ? `
              <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" 
                onclick="trackGAEvent('click_source_url', { category: '${escapeHtml(item.category)}', media: '${escapeHtml(item.media)}' })"
                class="text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                元投稿・記事を見る ↗
              </a>
            ` : '<span class="text-xs text-slate-400">リンクなし</span>'}
          </div>
        `;
        cardContainer.appendChild(card);

        // テーブル行生成
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        tr.innerHTML = `
          <td class="py-3 px-3 whitespace-nowrap text-slate-600 font-medium text-xs">${escapeHtml(item.date || '-')}</td>
          <td class="py-3 px-3 whitespace-nowrap">
            <span class="text-xs font-bold px-2 py-0.5 rounded-full border ${catStyle.badge}">${catStyle.icon} ${highlightText(item.category, keyword)}</span>
          </td>
          <td class="py-3 px-3 whitespace-nowrap text-xs font-medium text-slate-700">${highlightText(item.region || '-', keyword)}</td>
          <td class="py-3 px-3 whitespace-nowrap text-xs">
            <span class="font-bold px-1.5 py-0.5 rounded border ${mediaClass} mr-1">${highlightText(item.media, keyword)}</span>
            <span class="text-slate-600">${highlightText(item.author, keyword)}</span>
          </td>
          <td class="py-3 px-4 font-bold text-slate-800 text-xs sm:text-sm leading-relaxed">${highlightText(item.summary, keyword)}</td>
          <td class="py-3 px-3 whitespace-nowrap text-right text-xs font-bold text-amber-700">${escapeHtml(item.reaction || '-')}</td>
          <td class="py-3 px-3 whitespace-nowrap text-center">
            ${item.url ? `
              <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer"
                onclick="trackGAEvent('click_source_url', { category: '${escapeHtml(item.category)}', media: '${escapeHtml(item.media)}' })"
                class="text-xs font-bold text-indigo-600 hover:underline">開く ↗</a>
            ` : '-'}
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function highlightText(text, keyword) {
      const safeText = escapeHtml(text);
      if (!keyword) return safeText;
      const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return safeText.replace(regex, '<mark class="bg-yellow-200 text-slate-900 rounded px-0.5">$1</mark>');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('archive-container-card').classList.toggle('hidden', mode !== 'card');
      document.getElementById('archive-container-table').classList.toggle('hidden', mode !== 'table');
      
      document.getElementById('view-card-btn').className = mode === 'card'
        ? 'text-xs px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold shadow-sm transition'
        : 'text-xs px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-bold hover:bg-slate-50 transition';
      document.getElementById('view-table-btn').className = mode === 'table'
        ? 'text-xs px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold shadow-sm transition'
        : 'text-xs px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-bold hover:bg-slate-50 transition';

      trackGAEvent('change_view_mode', { view_mode: mode });
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      renderRecords();
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('category-select').value = 'ALL';
      document.getElementById('region-select').value = 'ALL';
      document.getElementById('media-select').value = 'ALL';
      document.getElementById('date-input').value = '';
      document.getElementById('sort-select').value = 'date_desc';
      initUI();
    }

    function trackGAEvent(eventName, params) {
      if (typeof gtag === 'function') {
        gtag('event', eventName, params);
      }
    }

    // イベントリスナー登録
    document.getElementById('search-input').addEventListener('input', renderRecords);
    document.getElementById('category-select').addEventListener('change', (e) => {
      trackGAEvent('filter_category', { category: e.target.value });
      initUI();
    });
    document.getElementById('region-select').addEventListener('change', (e) => {
      trackGAEvent('filter_region', { region: e.target.value });
      renderRecords();
    });
    document.getElementById('media-select').addEventListener('change', (e) => {
      trackGAEvent('filter_media', { media: e.target.value });
      renderRecords();
    });
    document.getElementById('date-input').addEventListener('change', (e) => {
      trackGAEvent('filter_date', { date: e.target.value });
      renderRecords();
    });
    document.getElementById('sort-select').addEventListener('change', renderRecords);

    // 初回データ読込
    fetchSheetData();
  </script>
</body>
</html>
